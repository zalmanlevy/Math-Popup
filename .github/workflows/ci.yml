# Typecheck + both JS builds (Electron bundle and the web/PWA bundle the iOS
# app wraps) on every push/PR. Cheap ubuntu runner; no native steps here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build desktop bundle
        run: npm run build

      - name: Build web bundle
        run: npm run build:web
