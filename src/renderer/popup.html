<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math Popup</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="title-bar">
    <div class="drag-handle"></div>
    <div class="left-actions">
      <button id="tabs-btn" class="icon-btn" title="Tabs (Ctrl+T for new)">📄</button>
      <button id="archive-btn" class="icon-btn" title="Recently Closed">🕒</button>
      <button id="mode-toggle-btn" class="icon-btn" title="Mode: Math">∑</button>
    </div>
    <div class="title-spacer"></div>
    <div class="actions">
      <button id="toggle-pin" title="Stay on top" class="icon-btn" aria-pressed="false">📌</button>
      <button id="show-vars" title="Variables" class="icon-btn vars-btn" aria-haspopup="true">ƒ</button>
      <button id="open-help" title="Help" class="icon-btn">?</button>
      <button id="open-settings" title="Settings" class="icon-btn">⚙</button>
      <button id="close-window" title="Close" class="icon-btn close">×</button>
    </div>
    <div id="archive-popup" class="vars-popup" hidden></div>
    <div id="vars-popup" class="vars-popup" hidden></div>
  </header>
  <nav id="tab-bar" class="tab-bar" aria-label="Open tabs">
    <div id="tab-strip" class="tab-strip"></div>
    <button id="tab-overflow-btn" class="tab-overflow-btn" title="More tabs" aria-label="More tabs" hidden>
      <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 L6 8 L9.5 4.5"/></svg>
    </button>
    <button id="tab-add-btn" class="tab-bar-add" title="New tab" aria-label="New tab">+</button>
  </nav>
  <div id="tab-overflow-popup" class="vars-popup tab-overflow-popup" hidden></div>
  <div id="tab-context-menu" class="tab-context-menu" hidden></div>
  <main class="editor-shell">
    <div id="line-gutter" class="line-gutter" aria-hidden="true"></div>
    <div class="editor-stack">
      <pre id="find-layer" class="find-layer" aria-hidden="true"></pre>
      <pre id="syntax-overlay" class="syntax-overlay" aria-hidden="true"></pre>
      <textarea id="editor"
                class="editor"
                spellcheck="false"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                wrap="soft"></textarea>
      <div id="measure" class="measure" aria-hidden="true"></div>
    </div>
    <div id="result-gutter" class="result-gutter" aria-hidden="true"></div>
    <div id="find-bar" class="find-bar" role="search" hidden>
      <input id="find-input" class="find-input" type="text" placeholder="Find" spellcheck="false" autocomplete="off" aria-label="Find in note" />
      <span id="find-count" class="find-count">0/0</span>
      <span class="find-divider"></span>
      <button id="find-prev" class="find-btn" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>
        <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5 L6 4 L9.5 7.5"/></svg>
      </button>
      <button id="find-next" class="find-btn" title="Next match (Enter)" aria-label="Next match" disabled>
        <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 L6 8 L9.5 4.5"/></svg>
      </button>
      <button id="find-close" class="find-btn find-close" title="Close (Esc)" aria-label="Close find">
        <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3 L9 9 M9 3 L3 9"/></svg>
      </button>
    </div>
  </main>
  <div id="cmd-menu" class="cmd-menu" role="listbox" aria-hidden="true" hidden></div>
  <div id="signature-tooltip" class="signature-tooltip" hidden></div>
  <div id="hover-tooltip" class="hover-tooltip" hidden></div>
  <footer class="status-bar">
    <span id="status-msg" class="status-msg">Ready</span>
    <span id="zoom-indicator" class="hint zoom-indicator" hidden>100%</span>
    <span id="page-indicator" class="hint">Page 1</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
